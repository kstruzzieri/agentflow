name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Tests and proof verification (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      AGENTFLOW_PROOF_ROOT: tests/fixtures/proof-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check version declarations
        run: python3 scripts/check_release.py

      - name: Check schema soak
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_schema_soak.py

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Verify configured proof
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          proof_root="$AGENTFLOW_PROOF_ROOT"
          if [ ! -f "$proof_root/.agent/proof-pack.json" ]; then
            echo "::error file=$proof_root/.agent/proof-pack.json::Agentflow proof metadata is missing"
            exit 1
          fi
          base_ref=""
          if [ "$proof_root" = "." ]; then
            # A pull request compares with its base commit, committed changes
            # included (#139). A push checks the ledgers only (HEAD): the pull
            # request run compared the edits, and a squash or rebase merge can
            # drop the baseline the run recorded.
            base_ref="${AGENTFLOW_PROOF_BASE_REF:-${PR_BASE_SHA:-HEAD}}"
          elif [ -n "${AGENTFLOW_PROOF_BASE_REF:-}" ]; then
            echo "::error::AGENTFLOW_PROOF_BASE_REF needs AGENTFLOW_PROOF_ROOT=. (a subdirectory is checked as a copy with no history)"
            exit 1
          fi
          AGENTFLOW_BASE_REF="$base_ref" PYTHONPATH=src PYTHON=python3 \
            sh examples/ci-proof/smoke.sh "$proof_root"

  integrations:
    name: Integration configs from the wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          python -m pip install build==1.5.0
          python -m build --wheel --outdir dist

      - name: Check integration configs from a clean install
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index dist/*.whl
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          python scripts/check_integrations.py examples/integrations
