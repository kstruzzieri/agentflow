name: PyPI watch

# Fails when PyPI serves a file for agentflow-proof that no GitHub release
# recorded. GitHub notifies the maintainer of a failed scheduled run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: PyPI files match the GitHub releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compare PyPI files with the release checksums
        run: python3 scripts/check_pypi_releases.py
