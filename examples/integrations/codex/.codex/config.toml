# Agentflow for Codex CLI, using the installed agentflow-proof package.
# Copy into your repository's .codex/config.toml. See docs/integrations.md.

[mcp_servers.agentflow]
command = "agentflow-mcp"
args = []

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '''agentflow stop-gate || { r=$(git rev-parse --show-toplevel 2>/dev/null || pwd); if [ -f "$r/.agent/plan.lock.json" ]; then printf '%s\n' '{"decision":"block","reason":"agentflow stop-gate could not run. Install or upgrade agentflow-proof to 1.9.0 or later so the agentflow command is on PATH, then try to stop again."}'; else printf '{}\n'; fi; }'''
command_windows = "agentflow stop-gate"
timeout = 600
