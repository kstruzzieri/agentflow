# Installs Agentflow for the GitHub Copilot cloud agent.
# Copy to .github/workflows/copilot-setup-steps.yml. See docs/integrations.md.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Agentflow
        run: python -m pip install "agentflow-proof>=1.9.0"
